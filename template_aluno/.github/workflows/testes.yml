name: Testes BiblioTech

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r template_aluno/requirements-dev.txt

      - name: Executar testes
        run: |
          python -m pytest -v \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing
